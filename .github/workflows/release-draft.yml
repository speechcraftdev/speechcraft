name: Build draft Linux release

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Exact 40-character source commit
        required: true
        type: string
      tag:
        description: New immutable version tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: speechcraft-draft-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  draft-linux-release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out the exact requested source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Confirm the requested source is the current main commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          case "$SOURCE_COMMIT" in *[!0-9a-f]*|'') echo 'source_commit must be a lowercase 40-character SHA' >&2; exit 1 ;; esac
          test "${#SOURCE_COMMIT}" -eq 40
          git cat-file -e "$SOURCE_COMMIT^{commit}"
          test "$SOURCE_COMMIT" = "$(git rev-parse origin/main)"

      - name: Check out the pinned source revision
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install locked frontend dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build and upload a draft only
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: launcher/scripts/publish-draft-release.sh "$RELEASE_TAG" "$SOURCE_COMMIT"
