[project]
name = "speechcraft-worker-linux-cuda-runtime"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "speechcraft-dataset-worker",
  "speechcraft-model-manager",
  "ctranslate2==4.7.2",
  "faster-whisper==1.2.1",
  "filelock==3.28.0",
  "hydra-core==1.3.2",
  "librosa==0.11.0",
  "numpy==2.4.6",
  "av==18.1.0",
  "onnxruntime==1.26.0",
  "pyannote.audio==4.0.3",
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-bin==1.13.8",
  "sherpa-onnx-core==1.13.8",
  "silero-vad==6.2.1",
  "soundfile==0.13.1",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "torchcodec==0.7.0",
  "transformers==4.57.6",
]

[tool.uv]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
speechcraft-dataset-worker = { path = "../.." }
speechcraft-model-manager = { path = "../../../../packages/model_manager" }
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
