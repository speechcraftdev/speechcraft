[project]
name = "speechcraft-worker-macos-arm64-runtime"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "speechcraft-dataset-worker",
  "speechcraft-model-manager",
  "av==18.1.0",
  "filelock==3.28.0",
  "hydra-core==1.3.2",
  "librosa==0.11.0",
  "mlx==0.32.4",
  "mlx-whisper==0.4.3",
  "numpy==2.4.6",
  "onnxruntime==1.26.0",
  "pyannote.audio==4.0.3",
  "scipy==1.18.1",
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-bin==1.13.8",
  "sherpa-onnx-core==1.13.8",
  "silero-vad==6.2.1",
  "soundfile==0.13.1",
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "transformers==4.57.6",
]

[tool.uv]
environments = ["sys_platform == 'darwin' and platform_machine == 'arm64'"]

[tool.uv.sources]
speechcraft-dataset-worker = { path = "../.." }
speechcraft-model-manager = { path = "../../../../packages/model_manager" }

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"
