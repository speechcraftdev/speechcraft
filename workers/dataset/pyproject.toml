[project]
name = "speechcraft-dataset-worker"
version = "0.1.0"
description = "Heavy audio dataset pipeline worker for SpeechCraft"
requires-python = ">=3.11,<3.13"
# Runtime dependencies are declared in runtime-profiles/*, each with its own
# immutable uv lock. This package is the shared worker code only.

[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["speechcraft_dataset*"]
