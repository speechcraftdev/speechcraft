[project]
name = "speechcraft-model-manager"
version = "0.1.0"
description = "Lightweight offline model verification and verified downloads for SpeechCraft"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["speechcraft_models*"]

[tool.setuptools.package-data]
speechcraft_models = ["*.json"]
